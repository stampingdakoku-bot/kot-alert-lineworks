<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Work Log{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">

    <style>
        :root {
            --nm-bg: #e0e5ec;
            --nm-text: #3d4457;
            --nm-text-dim: #7e879d;
            --nm-shadow-light: rgba(255,255,255,.85);
            --nm-shadow-dark: rgba(163,177,198,.6);
            --nm-accent: #4a7dfc;
            --nm-radius: 18px;
        }
        {% set _bg = (session.get('bg_color') or '').split('|') %}
        {% if _bg|length == 2 %}
        :root { --nm-bg: {{ _bg[1] }}; --nm-text: {{ _bg[0] }}; }
        {% endif %}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--nm-bg); color: var(--nm-text); }

        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--nm-accent); outline-offset: 2px; }

        nav { background: var(--nm-text); color: var(--nm-bg); padding: 14px 24px; display: flex; align-items: center; gap: 24px;
              box-shadow: 0 6px 12px rgba(0,0,0,.3); position: relative; z-index: 10; }
        nav a { color: var(--nm-bg); text-decoration: none; font-size: 14px; padding: 8px 14px; border-radius: 12px;
                opacity: .8; transition: opacity .15s ease, background .15s ease; }
        nav a:hover, nav a.active { opacity: 1; background: rgba(255,255,255,.16); }
        nav .brand { font-weight: bold; font-size: 16px; color: var(--nm-bg); opacity: 1; }
        .nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
        .nav-links .logout { margin-left: auto; }
        .hamburger { display: none; background: none; border: none; color: var(--nm-bg); font-size: 24px; cursor: pointer; padding: 8px; min-width: 44px; min-height: 44px; border-radius: 12px; }
        .hamburger:hover { box-shadow: inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light); }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .card { background: var(--nm-bg); border-radius: var(--nm-radius); padding: 24px; margin-bottom: 20px;
                box-shadow: -8px -8px 16px var(--nm-shadow-light), 8px 8px 16px var(--nm-shadow-dark); }
        .card h2 { margin-bottom: 16px; font-size: 18px; color: var(--nm-text); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; font-size: 14px; color: var(--nm-text); }
        th { background: transparent; font-weight: 600; color: var(--nm-text-dim); }
        tbody tr { box-shadow: inset 0 -1px 0 rgba(163,177,198,.3); }
        tbody tr:last-child { box-shadow: none; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        .btn { padding: 10px 18px; border: none; border-radius: 14px; cursor: pointer; font-size: 14px; text-decoration: none;
               display: inline-block; min-height: 44px; line-height: 24px; background: var(--nm-bg); color: var(--nm-text);
               box-shadow: -5px -5px 10px var(--nm-shadow-light), 5px 5px 10px var(--nm-shadow-dark);
               transition: box-shadow .12s ease; }
        .btn:active { box-shadow: inset 4px 4px 8px var(--nm-shadow-dark), inset -4px -4px 8px var(--nm-shadow-light); }
        .btn-primary { background: var(--nm-accent); color: #fff; box-shadow: -5px -5px 10px rgba(255,255,255,.5), 5px 5px 10px rgba(74,125,252,.5); }
        .btn-primary:active { box-shadow: inset 4px 4px 8px rgba(30,70,190,.55), inset -4px -4px 8px rgba(120,160,255,.5); }
        .btn-danger { background: #e0637c; color: #fff; box-shadow: -5px -5px 10px rgba(255,255,255,.45), 5px 5px 10px rgba(190,60,90,.5); }
        .btn-danger:active { box-shadow: inset 4px 4px 8px rgba(150,40,65,.55), inset -4px -4px 8px rgba(230,140,155,.5); }
        .btn-success { background: #3fb987; color: #fff; box-shadow: -5px -5px 10px rgba(255,255,255,.45), 5px 5px 10px rgba(30,140,100,.5); }
        .btn-success:active { box-shadow: inset 4px 4px 8px rgba(20,110,80,.55), inset -4px -4px 8px rgba(120,210,175,.5); }
        .btn:hover { opacity: .92; }

        input, select, textarea { padding: 10px 14px; border: none; border-radius: 12px; font-size: 14px; min-height: 44px;
                                   background: var(--nm-bg); color: var(--nm-text);
                                   box-shadow: inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light); }

        .flash { padding: 12px 16px; border-radius: 14px; margin-bottom: 16px; background: var(--nm-bg);
                 box-shadow: -4px -4px 8px var(--nm-shadow-light), 4px 4px 8px var(--nm-shadow-dark); }
        .flash-success { color: #1f7a4c; }
        .flash-error { color: #c0392b; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat { background: var(--nm-bg); border-radius: var(--nm-radius); padding: 16px; text-align: center;
                box-shadow: -6px -6px 12px var(--nm-shadow-light), 6px 6px 12px var(--nm-shadow-dark); }
        .stat .num { font-size: 28px; font-weight: bold; color: var(--nm-accent); }
        .stat .label { font-size: 12px; color: var(--nm-text-dim); margin-top: 4px; }

        .form-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; color: white; }
        .badge-active { background: #3fb987; }
        .badge-inactive { background: #98a2b3; }

        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30,34,44,0.45); z-index: 100; overflow-y: auto; }
        .modal { background: var(--nm-bg); color: var(--nm-text); border-radius: var(--nm-radius); padding: 24px; max-width: 500px; margin: 80px auto;
                 box-shadow: -12px -12px 24px var(--nm-shadow-light), 12px 12px 24px var(--nm-shadow-dark); }
        .modal h3 { margin-bottom: 16px; }
        .modal .form-row { margin-bottom: 12px; }
        .modal label { min-width: 120px; font-size: 14px; }

        /* 丸型ソフトサーフェス（アバター・ドット等の共通材質） */
        .nm-surface { background: var(--nm-bg); box-shadow: -4px -4px 8px var(--nm-shadow-light), 4px 4px 8px var(--nm-shadow-dark); }
        .nm-inset { background: var(--nm-bg); box-shadow: inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light); }

        @media (max-width: 768px) {
            nav { padding: 8px 16px; gap: 0; justify-content: space-between; }
            .hamburger { display: flex; align-items: center; justify-content: center; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 52px; left: 0; right: 0; background: var(--nm-text); padding: 8px 0; z-index: 50;
                         gap: 0; box-shadow: 0 6px 12px rgba(0,0,0,.3); }
            .nav-links.open { display: flex; }
            .nav-links a { padding: 14px 24px; width: 100%; border-radius: 0; font-size: 15px; }
            .nav-links .logout { margin-left: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
            .container { margin: 16px auto; padding: 0 12px; }
            .card { padding: 16px; }
            .card h2 { font-size: 16px; }
            .modal { margin: 16px; max-width: none; }
            .modal .form-row { flex-direction: column; align-items: stretch; }
            .modal label { min-width: auto; }
            .form-row { flex-direction: column; align-items: stretch; }
            .form-row input, .form-row select { width: 100%; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/my" class="brand">Work Log</a>
        <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="メニュー">&#9776;</button>
        <div class="nav-links">
            <a href="/" {% if request.path == '/' %}class="active"{% endif %}>今日の出勤一覧</a>
            <a href="/shifts" {% if '/shifts' in request.path %}class="active"{% endif %}>スケジュール</a>
            <a href="/my" {% if '/my' in request.path %}class="active"{% endif %}>マイメニュー</a>
            <a href="/settings" {% if request.path in ('/settings', '/staff', '/logs', '/stores') or request.path.startswith('/staff') %}class="active"{% endif %}>設定</a>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
