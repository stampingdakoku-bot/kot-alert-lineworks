<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - KoT Alert</title>
    <style>
        :root {
            --nm-bg: #e0e5ec; --nm-text: #3d4457; --nm-text-dim: #7e879d;
            --nm-shadow-light: rgba(255,255,255,.85); --nm-shadow-dark: rgba(163,177,198,.6);
            --nm-accent: #4a7dfc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--nm-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        :focus-visible { outline: 2px solid var(--nm-accent); outline-offset: 2px; }
        .login-box { background: var(--nm-bg); border-radius: 22px; padding: 40px; width: 100%; max-width: 320px; text-align: center;
                     box-shadow: -10px -10px 20px var(--nm-shadow-light), 10px 10px 20px var(--nm-shadow-dark); }
        .login-box h1 { font-size: 20px; color: var(--nm-text); margin-bottom: 8px; }
        .login-box p { font-size: 13px; color: var(--nm-text-dim); margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 24px; text-align: center; letter-spacing: 8px; margin-bottom: 16px; min-height: 52px;
                            background: var(--nm-bg); color: var(--nm-text);
                            box-shadow: inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light); }
        .login-box button { width: 100%; padding: 14px; background: var(--nm-accent); color: white; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; min-height: 48px;
                             box-shadow: -5px -5px 10px rgba(255,255,255,.5), 5px 5px 10px rgba(74,125,252,.5); }
        .login-box button:active { box-shadow: inset 4px 4px 8px rgba(30,70,190,.55), inset -4px -4px 8px rgba(120,160,255,.5); }
        .flash { padding: 8px 12px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; background: var(--nm-bg); color: #c0392b;
                 box-shadow: -3px -3px 6px var(--nm-shadow-light), 3px 3px 6px var(--nm-shadow-dark); }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>KoT Alert</h1>
        <p>パスコードを入力してください</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="passcode" maxlength="6" pattern="[0-9]*" inputmode="numeric" autofocus required>
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
